name: Reassemble Resonance Network and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive-parts/*.part*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Verify archive and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile

          manifest = json.loads(pathlib.Path('archive-manifest.json').read_text())
          parts = manifest['parts']
          if len(parts) != 4:
              raise SystemExit('Expected four archive parts')
          output = pathlib.Path(manifest['archive'])
          total_size = 0
          whole_hash = hashlib.sha256()
          with output.open('wb') as destination:
              for index, entry in enumerate(parts, 1):
                  expected = f'{manifest["archive"]}.part{index:02d}-of-04'
                  if entry['name'] != expected:
                      raise SystemExit(f'Unexpected part name: {entry["name"]}')
                  part = pathlib.Path('archive-parts') / entry['name']
                  if not part.is_file():
                      raise SystemExit(f'Missing archive part: {part}')
                  part_hash = hashlib.sha256()
                  part_size = 0
                  with part.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          part_hash.update(chunk)
                          whole_hash.update(chunk)
                          destination.write(chunk)
                          part_size += len(chunk)
                  if part_size != entry['size_bytes'] or part_hash.hexdigest() != entry['sha256']:
                      raise SystemExit(f'Integrity error: {part.name}')
                  total_size += part_size
          if total_size != manifest['size_bytes'] or whole_hash.hexdigest() != manifest['sha256']:
              raise SystemExit('Reassembled archive does not match original SHA-256 and size')
          print(f'Original archive verified: {total_size} bytes, SHA-256 {whole_hash.hexdigest()}')
          with zipfile.ZipFile(output) as archive:
              invalid = archive.testzip()
              if invalid:
                  raise SystemExit(f'Corrupted archive member: {invalid}')
              for member in archive.namelist():
                  name = pathlib.PurePosixPath(member)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'Unsafe archive entry: {member}')
              archive.extractall('source')
          if not pathlib.Path('source/organism/frontend/package.json').is_file():
              raise SystemExit('Expected Resonance Network React/Capacitor frontend was not found')
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'npm'
          cache-dependency-path: 'source/organism/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: source/organism/frontend
        run: npm ci

      - name: Build existing Resonance Network frontend
        working-directory: source/organism/frontend
        env:
          VITE_API_BASE_URL: \${{ vars.RESONANCE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo '::warning::RESONANCE_API_BASE_URL is unset. The APK can build, but network-backed functions need a deployed backend or an in-app API URL override.'
          fi
          npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate and synchronize Capacitor Android app
        working-directory: source/organism/frontend
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      - name: Build installable debug APK
        working-directory: source/organism/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-network-android-debug-apk
          path: source/organism/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
